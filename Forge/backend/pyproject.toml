[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgebot"
version = "0.1.0"
description = "Universal robot and automation editor"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ForgeBOT Authors" }]
dependencies = [
    "pydantic>=2.6",
    "tomli_w>=1.0",
    "numpy>=1.26",
    "lxml>=5.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "websockets>=12.0", "python-multipart>=0.0.9"]
mesh = ["trimesh>=4.0"]
collision = ["trimesh>=4.0", "python-fcl>=0.7", "scipy>=1.10"]
spatial = ["spatialmath-python>=1.1"]
toml-comments = ["tomlkit>=0.13"]
msgpack = ["msgpack>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
]

[project.scripts]
forgebot = "forgebot.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["forgebot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "RET", "SIM"]
ignore = ["E501"]  # black handles line length

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
